<nav class="navbar" [class.scrolled]="isScrolled">
  <div class="navbar-inner">
    <a class="logo" (click)="scrollToSection('home')">
      <img src="assets/images/shireen-logo.webp" alt="Shireen H Logo" class="logo-img" />
    </a>

    <div class="nav-links" [class.open]="isMobileMenuOpen">
      @for (link of navLinks; track link.sectionId) {
        @if (link.sectionId === 'contact') {
          <a
            class="nav-link contact-btn"
            [class.active]="activeSection === link.sectionId"
            (click)="scrollToSection(link.sectionId)">
            {{ link.label }}
          </a>
        } @else {
          <a
            class="nav-link"
            [class.active]="activeSection === link.sectionId"
            (click)="scrollToSection(link.sectionId)">
            {{ link.label }}
          </a>
        }
      }
    </div>

    <div class="nav-actions">
      <button
        class="theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isLight ? 'Switch to dark theme' : 'Switch to light theme'"
        [attr.title]="isLight ? 'Dark theme' : 'Light theme'">
        @if (isLight) {
          <!-- moon: go back to dark -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        } @else {
          <!-- sun: switch to light -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        }
      </button>

    <button
      class="hamburger"
      [class.active]="isMobileMenuOpen"
      (click)="toggleMobileMenu()"
      aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    </div>
  </div>
</nav>

<div
  class="nav-overlay"
  [class.open]="isMobileMenuOpen"
  (click)="toggleMobileMenu()">
</div>
