<section class="hero" id="home">
  <div class="hero-bg">
    <div class="grid-overlay"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <div class="container hero-content">
    <div class="row align-items-center">
      <div class="col-lg-6" data-aos="fade-right" data-aos-duration="1000">
        <div class="hero-text">
          <h1 class="hero-title">
            <span class="title-line">Hello! I'm <span class="highlight">Shireen H</span></span>
            <span class="typewriter-wrapper">
              <span class="typewriter-text">{{ displayText }}<span class="cursor">|</span></span>
            </span>
          </h1>
          <p class="hero-tagline">I Craft Digital Experiences That Users Love</p>
          <p class="hero-desc">
            Bridging the gap between design and code.
            From Figma wireframes to responsive Angular applications, I deliver
            end-to-end digital experiences.
          </p>
          <div class="hero-actions d-flex flex-wrap gap-3">
            <a class="btn-primary" (click)="scrollToSection('portfolio')">
              View My Work
              <span class="btn-arrow">&rarr;</span>
            </a>
            @if (links.resume) {
              <a class="btn-outline" [href]="links.resume" target="_blank" rel="noopener" download>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:8px"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
                Download Résumé
              </a>
            }
          </div>
        </div>
      </div>

      <div class="col-lg-6 hero-visual-col" data-aos="fade-left" data-aos-duration="1000" data-aos-delay="200">
        <div class="hero-visual d-flex justify-content-center align-items-center">
          <app-design-to-code />
        </div>
      </div>
    </div>
  </div>

</section>
