<section class="testimonials" id="testimonials">
  <div class="container">
    <div class="section-header" data-aos="fade-up">
      <span class="section-label">Testimonials</span>
      <h2 class="section-title">
        What Clients <span class="highlight">Say</span>
      </h2>
      <p class="section-subtitle">
        Hear from the people I've had the pleasure of working with.
      </p>
    </div>

    <div class="testimonial-carousel" data-aos="fade-up" data-aos-delay="200">
      <div class="carousel-track" [style.transform]="'translateX(-' + currentSlide * 100 + '%)'">
        @for (t of testimonials; track t.name) {
          <div class="testimonial-card" appTilt>
            
            <p class="testimonial-text">{{ t.text }}</p>
            <div class="testimonial-author">
              <div class="author-avatar">
                <span>{{ t.initials }}</span>
              </div>
              <div class="author-info">
                <span class="author-name">{{ t.name }}</span>
                <span class="author-role">{{ t.role }}</span>
              </div>
            </div>
          </div>
        }
      </div>

      <div class="carousel-controls">
        <button class="carousel-btn" (click)="prevSlide()" aria-label="Previous">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="carousel-dots">
          @for (t of testimonials; track t.name; let i = $index) {
            <button
              class="dot"
              [class.active]="currentSlide === i"
              (click)="goToSlide(i)"
              [attr.aria-label]="'Go to slide ' + (i + 1)">
            </button>
          }
        </div>
        <button class="carousel-btn" (click)="nextSlide()" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>
