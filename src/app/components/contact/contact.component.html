<section class="contact" id="contact">
  <div class="container">
    <div class="section-header" data-aos="fade-up">
      <span class="section-label">Get In Touch</span>
      <h2 class="section-title">
        Let's <span class="highlight">Collaborate</span>
      </h2>
      <p class="section-subtitle">
        Have a project in mind? Let's work together to create something amazing.
      </p>
    </div>

    <div class="contact-grid">
      <div class="contact-info" data-aos="fade-right" data-aos-delay="100">
        @for (info of contactInfo; track info.label) {
          <div class="info-card" appTilt>
            <div class="info-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path [attr.d]="info.icon"/>
              </svg>
            </div>
            <div class="info-content">
              <span class="info-label">{{ info.label }}</span>
              <span class="info-value">{{ info.value }}</span>
            </div>
          </div>
        }

        <div class="social-links">
          <span class="social-label">Follow Me</span>
          <div class="social-icons">
            @for (s of ['Dribbble', 'Behance', 'LinkedIn', 'Twitter']; track s) {
              <a class="social-icon" [attr.aria-label]="s">
                {{ s.charAt(0) }}
              </a>
            }
          </div>
        </div>
      </div>

      <form class="contact-form" (ngSubmit)="onSubmit()" data-aos="fade-left" data-aos-delay="200">
        <div class="form-row">
          <div class="form-group">
            <input
              type="text"
              placeholder="Your Name"
              [(ngModel)]="formData.name"
              name="name"
              required>
          </div>
          <div class="form-group">
            <input
              type="email"
              placeholder="Your Email"
              [(ngModel)]="formData.email"
              name="email"
              required>
          </div>
        </div>
        <div class="form-group">
          <input
            type="text"
            placeholder="Subject"
            [(ngModel)]="formData.subject"
            name="subject"
            required>
        </div>
        <div class="form-group">
          <textarea
            placeholder="Your Message"
            rows="6"
            [(ngModel)]="formData.message"
            name="message"
            required></textarea>
        </div>
        <button type="submit" class="submit-btn" [class.sent]="submitted">
          @if (submitted) {
            <span>Message Successfully Sent!</span>
          } @else {
            <span>Send Message</span>
            <span class="btn-arrow">&rarr;</span>
          }
        </button>
      </form>
    </div>
  </div>
</section>
