<section class="contact" id="contact">
  <div class="container">
    <div class="section-header text-center mb-5" data-aos="fade-up">
      <span class="section-label">Get In Touch</span>
      <h2 class="section-title">
        Let's <span class="highlight">Collaborate</span>
      </h2>
      <p class="section-subtitle mx-auto">
        Have a project in mind? Let's work together to create something amazing.
      </p>
    </div>

    <div class="row gy-4">
      <div class="col-lg-5" data-aos="fade-right" data-aos-delay="100">
        <div class="contact-info">
          @for (info of contactInfo; track info.label) {
            <div class="info-card" appTilt>
              <div class="info-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path [attr.d]="info.icon"/>
                </svg>
              </div>
              <div class="info-content">
                <span class="info-label">{{ info.label }}</span>
                <span class="info-value">{{ info.value }}</span>
              </div>
            </div>
          }

      
        </div>
      </div>

      <div class="col-lg-7" data-aos="fade-left" data-aos-delay="200">
        <form class="contact-form d-flex flex-column gap-3" (ngSubmit)="onSubmit()">
          <div class="row g-3">
            <div class="col-md-6">
              <input
                type="text"
                class="form-control"
                placeholder="Your Name"
                [(ngModel)]="formData.name"
                name="name"
                required>
            </div>
            <div class="col-md-6">
              <input
                type="email"
                class="form-control"
                placeholder="Your Email"
                [(ngModel)]="formData.email"
                name="email"
                required>
            </div>
          </div>
          <input
            type="text"
            class="form-control"
            placeholder="Subject"
            [(ngModel)]="formData.subject"
            name="subject"
            required>
          <textarea
            class="form-control"
            placeholder="Your Message"
            rows="6"
            [(ngModel)]="formData.message"
            name="message"
            required></textarea>
          <button type="submit" class="submit-btn" [class.sent]="submitted" [class.error]="error" [disabled]="sending">
            @if (sending) {
              <span>Sending...</span>
            } @else if (submitted) {
              <span>Message Successfully Sent!</span>
            } @else if (error) {
              <span>Failed to send. Try again.</span>
            } @else {
              <span>Send Message</span>
              <span class="btn-arrow">&rarr;</span>
            }
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
